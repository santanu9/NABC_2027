<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NABC 2027 · Program Planner</title>
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <div class="brand"><img src="img/logo.png" alt="NABC"><div><b>NABC 2027</b><span>Program Planner · Cow Palace, Daly City</span></div></div>
    <nav id="mainnav">
      <button data-view="plan" class="on">Plan</button>
      <button data-view="schedule">Key Times</button>
      <button data-view="venues">Venues</button>
      <button data-view="people">People</button>
      <button data-view="settings">Reminders</button>
    </nav>
    <button class="btn gold" id="addTaskTop" hidden>+ Add task</button>
    <div id="who"></div>
  </div>
</header>

<section class="hero"><div class="wrap hero-in"><div><p class="eyebrow">47th North American Bengali Conference · July 2–4, 2027</p><h1>Bengal Soul, Silicon Mind</h1></div><div class="countdown" id="countdown"></div></div></section>

<main class="wrap">
  <section id="v-plan" class="view">
    <div class="daytabs" id="daytabs"></div>
    <div class="toolbar">
      <input id="q" type="search" placeholder="Search tasks, people, venues…">
      <select id="fStatus"><option value="">Any status</option><option value="todo">To do</option><option value="in_progress">In progress</option><option value="blocked">Blocked</option><option value="done">Done</option><option value="overdue">Overdue</option></select>
      <select id="fVenue"></select>
      <select id="grp"><option value="day">Group: Day</option><option value="dept">Group: Department</option><option value="venue">Group: Venue</option><option value="none">No grouping</option></select>
      <label class="chk"><input type="checkbox" id="hideDone"> Hide done</label>
      <div class="seg"><button id="vList" class="on">List</button><button id="vBoard">Board</button></div>
    </div>
    <div class="dchips" id="deptChips"></div>
    <div class="stats" id="stats"></div>
    <div id="dayKeys"></div>
    <div id="tasks"></div>
  </section>
  <section id="v-schedule" class="view" hidden></section>
  <section id="v-venues" class="view" hidden></section>
  <section id="v-people" class="view" hidden></section>
  <section id="v-settings" class="view" hidden></section>
</main>

<footer><div class="wrap">NABC 2027 Program Planner · Cow Palace, 2600 Geneva Ave, Daly City, CA 94014 · All times Pacific</div></footer>

<div id="login" hidden><form id="loginForm"></form></div>
<dialog id="dlg"><form method="dialog" id="form"></form></dialog>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
